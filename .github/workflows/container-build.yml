name: Worker CI & Container Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Quality Gates & External Container Build
    runs-on: ubuntu-latest
    env:
      UV_CONCURRENT_DOWNLOADS: '1'
      UV_CONCURRENT_BUILDS: '1'
      UV_CONCURRENT_INSTALLS: '1'
      RAYON_NUM_THREADS: '1'
      TOKIO_WORKER_THREADS: '1'
      MALLOC_ARENA_MAX: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python Syntax Check
        run: python3 -m py_compile app/main.py

      - name: Install locked security-qualification dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/f11-sdk019-venv
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-sin tesseract-ocr-tam qpdf fonts-dejavu-core redis-server
          python -m pip install --no-cache-dir uv==0.11.28
          uv lock --check --offline
          uv sync --frozen --no-install-project
          uv pip check --python "$UV_PROJECT_ENVIRONMENT/bin/python"

      - name: Verify strict Worker body integrity and multipart replay
        env:
          APP_ENV: test
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/f11-sdk019-venv
        run: |
          timeout 120s "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q --tb=short -p anyio.pytest_plugin -p no:cacheprovider tests/test_f15_render_session_integration.py tests/test_security.py tests/test_security_body.py tests/test_ocr_v2_api.py tests/test_gateway_protocol.py tests/test_gateway_forwarding.py tests/test_sign.py tests/test_redact.py

      - name: Qualify installed SDK and F-11 security boundaries
        env:
          APP_ENV: test
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/f11-sdk019-venv
          F11_INSTALLED_ENV_ROOT: ${{ runner.temp }}/f11-sdk019-venv
        run: |
          unset PYTHONPATH F11_SDK_CANDIDATE_ROOT
          timeout 120s prlimit --as=1073741824 --cpu=90 -- "$UV_PROJECT_ENVIRONMENT/bin/python" - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          import sys
          import sysconfig
          import tomllib

          import platen_document
          import pytest

          assert sys.version_info[:2] == (3, 12)
          assert Path(sys.prefix).resolve() == Path(os.environ["F11_INSTALLED_ENV_ROOT"]).resolve()
          assert importlib.metadata.version("platen-document") == "0.1.9"
          expected = Path(sysconfig.get_path("purelib")) / "platen_document/__init__.py"
          assert Path(platen_document.__file__).resolve() == expected.resolve()
          assert expected.resolve().is_relative_to(Path(sys.prefix).resolve())
          lock = tomllib.loads(Path("uv.lock").read_text())
          sdk = next(package for package in lock["package"] if package["name"] == "platen-document")
          assert sdk["version"] == "0.1.9"
          assert sdk["sdist"]["hash"] == "sha256:74634f3e23dda9ed1740e1a840e263db47ab255a6a431ade8fe7bdff5d2f90f1"
          assert [wheel["hash"] for wheel in sdk["wheels"]] == ["sha256:70919a01664643b7b5e95d38d893b61b326b9e57bb0a0ddadf79d135c214e21b"]
          print("Installed SDK:", importlib.metadata.version("platen-document"), platen_document.__file__)

          class NoMandatorySkips:
              def __init__(self):
                  self.skipped = []

              def pytest_collectreport(self, report):
                  if report.skipped:
                      self.skipped.append(report.nodeid)

              def pytest_runtest_logreport(self, report):
                  if report.skipped:
                      self.skipped.append(report.nodeid)

          # Fake hostile pages and selector failures run first. Only the
          # designated small native fixtures follow; no load/stress suites.
          files = [
              "tests/test_raster_sdk_boundary.py",
              "tests/test_raster_admission.py",
              "tests/test_gateway_protocol.py",
              "tests/test_gateway_forwarding.py",
              "tests/test_raster_geometry_contract.py",
              "tests/test_raster_public_contract.py",
              "tests/test_ocr_v2_worker_core.py",
              "tests/test_structured_ocr.py",
              "tests/test_ocr_v2_markup.py",
              "tests/test_ocr_text_engine_boundary.py",
              "tests/test_document_extraction_engine_boundary.py",
              "tests/test_searchable_pdf_engine_boundary.py",
              "tests/test_ocr_markup_engine_boundary.py",
              "tests/test_editor_ocr_engine_boundary.py",
              "tests/test_legacy_editor_ocr_engine.py",
              "tests/test_legacy_markup_ocr_engine.py",
              "tests/test_studio_editor_extraction_engine.py",
              "tests/test_studio_markup_region_ocr_engine.py",
              "tests/test_pdf_to_markdown_engine_boundary.py",
              "tests/test_pdf_to_word_ocr_engine.py",
              "tests/test_studio_editor_compile_geometry.py",
              "tests/test_ocr_cancellation.py::test_extract_text_cancellation_before_start",
              "tests/test_ocr_cancellation.py::test_extract_text_cancellation_during_ocr",
              "tests/test_pdf_to_word_parallelism.py::test_ordinary_page_keeps_existing_raster_default",
              "tests/test_pdf_to_word_parallelism.py::test_scanned_pdf_to_word_uses_structured_ocr_v2",
          ]
          gate = NoMandatorySkips()
          result = pytest.main(["-q", "--tb=short", "-p", "no:cacheprovider", *files], plugins=[gate])
          if gate.skipped:
              raise SystemExit("Mandatory security tests skipped: " + ", ".join(gate.skipped))
          raise SystemExit(result)
          PY

      - name: Qualify native OCR process isolation
        env:
          APP_ENV: test
          STORAGE_MODE: local
          WORKER_SHARED_SECRET: synthetic-f11-ci-secret
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/f11-sdk019-venv
        run: |
          timeout 240s "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p anyio.pytest_plugin tests/test_native_isolation.py tests/test_subprocess_runner.py tests/test_ocr_v2_api.py tests/test_ocr_markup_preview.py

      - name: Qualify preview raster and session resource safety
        env:
          APP_ENV: test
          STORAGE_MODE: local
          WORKER_SHARED_SECRET: synthetic-f12-ci-secret
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/f11-sdk019-venv
        run: |
          timeout 90s "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q -p anyio.pytest_plugin tests/test_render_resource_safety.py tests/test_render_sessions.py tests/test_render_capacity.py tests/test_render_session_metadata.py

      - name: Qualify Markdown execution admission
        env:
          APP_ENV: test
          STORAGE_MODE: local
          WORKER_SHARED_SECRET: synthetic-f14-ci-secret
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/f11-sdk019-venv
        run: |
          timeout 90s "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q tests/test_markdown_admission.py tests/test_limiter.py tests/test_pdf_to_markdown.py

      - name: Qualify Editor export text fidelity
        env:
          APP_ENV: test
          STORAGE_MODE: local
          WORKER_SHARED_SECRET: synthetic-f16-ci-secret
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/f11-sdk019-venv
        run: |
          timeout 90s "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q \
            tests/test_editor_text_fidelity.py tests/test_editor.py \
            tests/test_phase3a_surgical_rendering.py tests/test_phase3b_text_formatting_engine.py \
            tests/test_phase3c_fidelity_audit.py tests/test_phase3d_word_level_style_editing.py \
            tests/test_phase4_safety_rules.py tests/test_editor_rotation_rollback.py \
            tests/test_studio_editor_compile_geometry.py tests/test_editor_native_colors.py \
            tests/test_editor_ocr_engine_boundary.py tests/test_studio_editor_sdk_projection.py \
            tests/test_legacy_editor_ocr_engine.py tests/test_phase8_editor_ocr_v2.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Image 1: Worker Web API (Dockerfile)
      - name: Extract Metadata for Worker Web API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pdfnest-worker
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Worker Web API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image 2: Dramatiq Task Actor (Dockerfile.worker)
      - name: Extract Metadata for Dramatiq Task Actor
        id: meta-actor
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pdfnest-worker-actor
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Dramatiq Task Actor Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          tags: ${{ steps.meta-actor.outputs.tags }}
          labels: ${{ steps.meta-actor.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
